name: "Python Setup and Install Dependencies"
description: "Sets up Python, and installs requirements and dependencies with cache."
inputs:
  python-version:
    description: "The Python version to use"
    required: true
    default: "3.13"
  requirements-files:
    description: "Space-separated list of requirements files (e.g., 'requirements.txt requirements-dev.txt')"
    required: true
    default: "requirements.txt requirements-dev.txt"

runs:
  using: "composite"
  steps:
    - name: 🐍 Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: ⚙️ Cache Python dependencies
      uses: actions/cache@v4
      id: cache-dependencies
      with:
        path: ~/.cache/pip
        # Create a single hash key from all provided requirement files
        key: ${{ runner.os }}-python-${{ hashFiles(inputs.requirements-files) }}
        restore-keys: |
          ${{ runner.os }}-python-

    - name: 📦 Install dependencies
      if: steps.cache-dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Loop through all provided requirement files and install them
        for file in ${{ inputs.requirements-files }}; do
          if [ -f "$file" ]; then pip install -r "$file"; fi
        done
