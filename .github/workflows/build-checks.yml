name: Build, Lint and Test

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  setup:
    name: ⚙️ Setup and Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚡️ Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          python-version: "3.13"
          requirements-files: "requirements.txt requirements-dev.txt"

  lint:
    name: 🔎 Lint with Pylint
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚡️ Setup dependencies
        uses: ./.github/actions/install-dependencies
        with:
          python-version: "3.13"
          requirements-files: "requirements.txt requirements-dev.txt"

      - name: 🔎 Run Pylint
        run: |
          pylint $(git ls-files '*.py')

  test:
    name: 🧪 Test with Pytest
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚡️ Setup dependencies
        uses: ./.github/actions/install-dependencies
        with:
          python-version: "3.13"
          requirements-files: "requirements.txt requirements-dev.txt"

      - name: 🧪 Run Pytest
        run: |
          python -m pytest --load-plugins pylint_pydantic
